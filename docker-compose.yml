version: '3.8'

services:
  # 1. SERVIÇO DE BANCO DE DADOS (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: toshiro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Senha123
      POSTGRES_DB: meubanco
    volumes:
      # Renomeado para banco.sql para compatibilidade com o PostgreSQL
      - ./banco.sql:/docker-entrypoint-initdb.d/banco.sql
    expose:
      - "5432"
    
    # Healthcheck Estável para PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d meubanco"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 2. MICROSSERVIÇOS DA APLICAÇÃO (PHP - 3 Réplicas)
  # O 'build: .' usa o Dockerfile no diretório atual para instalar as extensões.
  php1:
    # 💥 MUDANÇA: Usa o Dockerfile local para instalar o driver pgsql
    build: . 
    container_name: php1
    volumes:
      - ./index.php:/var/www/html/index.php
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  php2:
    # 💥 MUDANÇA: Usa o Dockerfile local
    build: .
    container_name: php2
    volumes:
      - ./index.php:/var/www/html/index.php
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  php3:
    # 💥 MUDANÇA: Usa o Dockerfile local
    build: .
    container_name: php3
    volumes:
      - ./index.php:/var/www/html/index.php
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  # 3. SERVIÇO GATEWAY/LOAD BALANCER (NGINX)
  nginx-lb:
    image: nginx:latest
    container_name: nginx-lb
    restart: unless-stopped
    ports:
      - "4500:4500"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php1
      - php2
      - php3